[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cogtran2"
version = "0.2.0"
description = "CogTran2 cognate detection models for ASJP-tokenized forms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "lingpy>=2.6.10",
    "transformers>=4.40",
]

[tool.setuptools.packages.find]
include = ["cogtran2*"]
